- tapOn: "কোড পাঠান"
- tapOn: "৬ সংখ্যার ওটিপি কোড"
- inputText: "123456"
- tapOn: "যাচাই করুন"
- tapOn: "চালু করুন"

# Simulated foreground push (dev control) → banner appears with the class label.
- tapOn: "সেটিংস"
- tapOn: "নোটিশ"
- tapOn: "টেস্ট নোটিফিকেশন পাঠান"
- assertVisible: "টেস্ট নোটিফিকেশন পাঠানো হয়েছে (টেস্ট লেখা সহ)"
