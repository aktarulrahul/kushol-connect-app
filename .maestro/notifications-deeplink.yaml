# NTF-E2E-002 — foreground banner + deep link: a simulated foreground push renders the in-app
# banner (no tray duplicate), tapping lands on the notice detail; unknown links fall home.
# Driven via /dev/chat-fixtures-style dev switcher → pushDemoBanner (dev builds only).
#   maestro test .maestro/notifications-deeplink.yaml
# NOT yet run — Maestro CLI/device not available in the build environment (pending owner).
