          description: Opaque cursor (created_at+id of the oldest already-loaded message)
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Newest page first
          headers:
