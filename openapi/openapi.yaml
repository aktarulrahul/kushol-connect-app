            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: >-
            Tenants page — id, names, type, city, status, createdAt.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolPage'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/admin/stats:
    get:
      operationId: getAdminStats
      tags: [console]
      summary: Platform dashboard counts (Super Admin; revenue placeholder per WEB-BR-009)
      security:
        - bearerJWT: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Tenants, cities, leads by status/type, pending vendors, revenue placeholder
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStats'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/school/stats:
    get:
      operationId: getSchoolStats
      tags: [console]
      summary: School dashboard counts (claim-scoped; partial-payload flags per source)
      security:
        - bearerJWT: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: students / activeSections / pendingVerifications / noticesLast30d
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolStats'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/admin/audit-log:
    get:
      operationId: listAdminAuditLog
      tags: [console]
      summary: Read-only audit viewer over 01's append-only log (Super Admin)
      security:
        - bearerJWT: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: entityType
          in: query
          required: false
          schema:
            type: string
        - name: entityId
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Newest-first audit page (no mutation affordance exists)
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogPage'
        default:
          $ref: '#/components/responses/Problem'
components:
  headers:
    XRequestId:
      description: Request correlation id (incoming value reused when valid, otherwise a uuid v7)
      schema:
        type: string
        maxLength: 64
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: '`bn` (default) or `en` — selects the language of `Problem.message`'
      schema:
        type: string
  responses:
    Problem:
      description: Error (RFC-7807)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    DependencyCheck:
      type: object
      required: [name, ok]
      properties:
        name:
          type: string
          description: Dependency name, e.g. `postgres`, `redis`
        ok:
          type: boolean
        latencyMs:
          type: integer
          minimum: 0
    Readiness:
      type: object
      required: [status, dependencies]
      properties:
        status:
          type: string
          enum: [ready]
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/DependencyCheck'
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: JSON pointer or parameter name of the rejected input
        message:
          type: string
          description: Localized (bn default / en)
    ProblemErrors:
      type: object
      properties:
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    Problem:
      type: object
      description: RFC-7807 problem details with Kushol extensions.
      required: [type, title, status, code, message, requestId]
      properties:
        type:
          type: string
          description: URI reference identifying the problem type
        title:
          type: string
          description: Short English summary (not for display)
        status:
          type: integer
          minimum: 100
          maximum: 599
        code:
          type: string
          description: |
            Stable machine code — open set. Core: UNAUTHENTICATED, FORBIDDEN, VALIDATION_FAILED,
            TENANT_MISMATCH, NOT_FOUND, NOT_VERIFIED, RATE_LIMITED, QUOTA_EXCEEDED, CONFLICT,
            INTERNAL. Module-specific codes are registered in
            docs/modules/01-foundations/technical-document.md §10.
        message:
          type: string
          description: Localized, user-displayable message (bn default, en on request)
        requestId:
          type: string
        detail:
          type: string
        errors:
          $ref: '#/components/schemas/ProblemErrors'
        dependencies:
          type: array
          description: Present on readiness failures — names each dependency and its state
          items:
            $ref: '#/components/schemas/DependencyCheck'
    UserRole:
      type: string
      enum: [super_admin, school_admin, teacher, student, guardian, vendor]
      description: '`vendor` is platform-scoped (`schoolId` null) and never self-registered'
    UserStatus:
      type: string
      enum: [PENDING, VERIFIED, SUSPENDED]
    Locale:
      type: string
      enum: [bn, en]
    Plan:
      type: string
      enum: [free, pro]
    OtpChannel:
      type: string
      enum: [sms, email]
    OtpPurpose:
      type: string
      enum: [login, register, link]
      description: '`reset` OTPs are issued internally by `/auth/password/forgot` only'
    User:
      type: object
      description: Public user shape — phone numbers are always masked
      required: [id, role, status, locale, fullName, isAmbassador, plan]
      properties:
        id:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        locale:
          $ref: '#/components/schemas/Locale'
        fullName:
          type: string
        maskedPhone:
          type: string
          description: e.g. `+8801XXXXXX789` — present when the account has a phone
        email:
          type: string
          description: present when the account has an email
        schoolId:
          type: string
          nullable: true
        isAmbassador:
          type: boolean
        plan:
          $ref: '#/components/schemas/Plan'
    RegisterInput:
      type: object
      required: [locale, role, fullName, schoolId, sectionId]
      description: |
        `phone`+`otpCode` are required for student/guardian (OTP purpose `register` proven).
        Staff may register with `email`+`password` instead (phone optional). `studentCode`
        and `relation` are required when role is `guardian`. No class field — the class
        level is derived from the section.
      properties:
        locale:
          $ref: '#/components/schemas/Locale'
        role:
          $ref: '#/components/schemas/UserRole'
        fullName:
          type: string
          minLength: 2
          maxLength: 80
        phone:
          type: string
          description: BD mobile, normalized server-side to E.164 `+880…`
        otpCode:
          type: string
          description: The code verified via `/auth/otp/verify` (purpose `register`)
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 10
          maxLength: 128
          description: Staff registration only (argon2id server-side)
        schoolId:
          type: string
        sectionId:
          type: string
        studentCode:
          type: string
          minLength: 3
          maxLength: 20
          description: Guardian only — the child's student ID
        relation:
          type: string
          enum: [father, mother, other]
          description: Guardian only
    RegisterResult:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [user, verificationRequest]
          properties:
            user:
              $ref: '#/components/schemas/User'
            accessToken:
              type: string
              description: Present only when the phone OTP completed in this flow
            refreshToken:
              type: string
            verificationRequest:
              $ref: '#/components/schemas/VerificationRequestItem'
    OtpRequestInput:
      type: object
      description: Exactly one of `phone` / `email`.
      properties:
        phone:
          type: string
        email:
          type: string
          format: email
        purpose:
          $ref: '#/components/schemas/OtpPurpose'
    OtpSendResult:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [sentAt, cooldownSeconds, channel]
          properties:
            sentAt:
              type: string
              format: date-time
            cooldownSeconds:
              type: integer
              minimum: 0
            channel:
              $ref: '#/components/schemas/OtpChannel'
    OtpVerifyInput:
      type: object
      required: [otpCode, purpose]
      description: Exactly one of `phone` / `email` (matching the request channel).
      properties:
        phone:
          type: string
        email:
          type: string
          format: email
        otpCode:
          type: string
          minLength: 6
          maxLength: 6
        purpose:
          $ref: '#/components/schemas/OtpPurpose'
    OtpVerifyResult:
      type: object
      required: [data]
      properties:
        data:
          type: object
          description: |
            `login` on a known phone/email returns tokens + user; an unknown target answers
            `{status:"unknown_phone"}` or `{status:"unknown_email"}` (deliberate — OTP proves
            possession and registration shares the code path). `register`/`link` return
            `{status:"verified"}`.
          required: [status]
          properties:
            status:
              type: string
              enum: [ok, unknown_phone, unknown_email, verified]
            accessToken:
              type: string
            refreshToken:
              type: string
            user:
              $ref: '#/components/schemas/User'
    ForgotPasswordInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    ResetPasswordInput:
      type: object
      required: [email, otpCode, newPassword]
      properties:
        email:
          type: string
          format: email
        otpCode:
          type: string
          minLength: 6
          maxLength: 6
        newPassword:
          type: string
          minLength: 10
          maxLength: 128
    RefreshInput:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    RefreshResult:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [accessToken, refreshToken]
          properties:
            accessToken:
              type: string
            refreshToken:
              type: string
    LogoutInput:
      type: object
      description: App clients pass the current refresh token; web relies on the cookie.
      properties:
        refreshToken:
          type: string
    MeResult:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/User'
    MeUpdateInput:
      type: object
      minProperties: 1
      properties:
        locale:
          $ref: '#/components/schemas/Locale'
        fullName:
          type: string
          minLength: 2
          maxLength: 80
        avatarUrl:
          type: string
          format: uri
    VerificationRequestStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, CANCELLED]
    VerificationRequestItem:
      type: object
      required: [id, user, status, createdAt, reminderCount]
      properties:
        id:
          type: string
        user:
          type: object
          required: [fullName, role]
          properties:
            fullName:
              type: string
            role:
              $ref: '#/components/schemas/UserRole'
            phoneMasked:
              type: string
        status:
          $ref: '#/components/schemas/VerificationRequestStatus'
        evidence:
          type: object
          description: '`{studentCode, relation}` for guardians; free-form, proof only'
          additionalProperties: true
        decisionReason:
          type: string
          description: Present on REJECTED — the bn/en key + params are resolved client-side
        createdAt:
          type: string
          format: date-time
        reminderCount:
          type: integer
          minimum: 0
    VerificationRequestPage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/VerificationRequestItem'
        nextCursor:
          type: string
    ApproveInput:
      type: object
      description: Guardian requests require `studentUserId` (the matched same-school VERIFIED student).
      properties:
        studentUserId:
          type: string
    RejectInput:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 10
          maxLength: 500
    DecisionResult:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, status]
          properties:
            id:
              type: string
            status:
              $ref: '#/components/schemas/VerificationRequestStatus'
            userStatus:
              $ref: '#/components/schemas/UserStatus'
    SchoolUser:
      type: object
      required: [id, fullName, role, status, createdAt]
      properties:
        id:
          type: string
        fullName:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        maskedPhone:
          type: string
        isAmbassador:
          type: boolean
        createdAt:
          type: string
          format: date-time
    HierarchyCity:
      type: object
      required: [id, nameBn, nameEn, isLaunchCity]
      properties:
        id:
          type: string
        nameBn:
          type: string
        nameEn:
          type: string
        isLaunchCity:
          type: boolean
    HierarchyCityPage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/HierarchyCity'
    HierarchySchool:
      type: object
      required: [id, nameBn, nameEn]
      properties:
        id:
          type: string
        nameBn:
          type: string
        nameEn:
          type: string
    HierarchySchoolPage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/HierarchySchool'
    HierarchySection:
      type: object
      required: [id, classLevel, name, sessionYear]
      properties:
        id:
          type: string
        classLevel:
          type: string
          description: e.g. `6`..`10` — the class dropdown derives its options from these
        name:
          type: string
          description: Section name, e.g. `A`, `B` (bn/en resolved client-side)
        sessionYear:
          type: integer
    HierarchySectionPage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/HierarchySection'
    SchoolRequestType:
      type: string
      enum: [school, college]
    SchoolRequestStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]
    SchoolRequestInput:
      type: object
      required: [name, type, cityId, pocName, pocPhone]
      description: Submitted from registration when the school dropdown has no match. The POC is whom the application admin connects to onboard the institution.
      properties:
