  /api/v1/chat/groups/{groupId}/messages:
    get:
      operationId: listChatMessages
      tags: [chat]
      summary: Group history, 50/page, cursor `before`
      description: Member guard (`FORBIDDEN` otherwise); tombstones are included and marked so
        renderers can swap them.
      security:
