          maxLength: 120
        type:
          $ref: '#/components/schemas/SchoolRequestType'
        cityId:
          type: string
        address:
          type: string
          maxLength: 240
        pocName:
          type: string
          minLength: 2
          maxLength: 80
        pocPhone:
          type: string
          description: BD mobile, normalized server-side to E.164
        pocEmail:
          type: string
          format: email
    SchoolRequestCreated:
