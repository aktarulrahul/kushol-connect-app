    PaymentsTransaction:
      type: object
      required: [id, gateway, amountBdt, convenienceFeeBdt, status, createdAt]
      properties:
        id:
          type: string
        invoiceId:
          type: string
        orderId:
          type: string
        title:
          type: string
        gateway:
          $ref: '#/components/schemas/PaymentsGateway'
        amountBdt:
          type: number
          format: double
        convenienceFeeBdt:
          type: number
          format: double
        status:
          $ref: '#/components/schemas/PaymentsTxnStatus'
        receiptUrl:
          type: string
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
    PaymentsTransactionList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PaymentsTransaction'
    PaymentsTransactionResult:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/PaymentsTransaction'
    PaymentsInvoiceStatusResult:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [invoiceId, status, amountBdt]
          properties:
            invoiceId:
              type: string
            status:
              $ref: '#/components/schemas/PaymentsInvoiceStatus'
            amountBdt:
              type: number
              format: double
            paidTxnId:
              type: string
            lastTxnStatus:
              $ref: '#/components/schemas/PaymentsTxnStatus'
    PaymentsReceiptResult:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [receiptUrl, serialNo, issuedAt]
          properties:
            receiptUrl:
              type: string
            serialNo:
              type: string
            issuedAt:
              type: string
              format: date-time
    PaymentsWebhookResult:
      type: object
      required: [processed]
      properties:
        processed:
          type: boolean
        reason:
          type: string
          description: 'DUPLICATE_WEBHOOK etc. — always 2xx for valid signatures'
  securitySchemes:
    bearerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Mobile access token — 15 min, HS256, claims `sub, role, schoolId, status, locale`
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-kushol_session
      description: Web http-only session cookie (opaque 256-bit token, server-side SHA-256)
