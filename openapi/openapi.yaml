openapi: 3.1.0
info:
  title: Kushol Connect API
  version: 0.1.0
  description: |
    Single source of truth for API types (FND-BR-001). Go server types are generated with
    oapi-codegen and the TS client with openapi-typescript (`make contracts`). Never hand-edit
    generated code.

    Errors are RFC-7807 `application/problem+json` (`Problem`). `code` is an **open set**:
    clients must fall back to generic bn/en copy for codes they do not know.
servers:
  - url: https://api.kusholconnect.com
    description: Production (mobile clients)
  - url: http://localhost:5433
    description: Local development
tags:
  - name: health
    description: Liveness and readiness (consumed by 15-deployment-operations)
  - name: auth
    description: Registration, login (OTP / password / SSO), tokens and sessions (03-identity-access)
  - name: users
    description: The authenticated user's own account (03-identity-access)
  - name: verification
    description: Join-request queue and school roster (03-identity-access; queue UI built by 07)
  - name: hierarchy
    description: Master-data reads for registration pickers (owned by 04; served by 03's fake until 04 lands)
  - name: school-requests
    description: New school/college requests from registration (03 until 04 absorbs onboarding)
  - name: chat
    description: >
      Group chat (official/custom/dm), DMs and Message Requests (05-communication-engine).
      Realtime lives on GET /api/v1/ws (gorilla upgrade); REST here is lists, fallback send and
      membership/admin actions. Auth chain + verified gate on every route.
  - name: notices
    description: >
      One-way notice boards, school and section scope (05-communication-engine). Read for all
      verified tenant members; publish per the role→scope matrix (School Admin = school,
      Teacher = own section). Immutable after publish except pin + soft delete.
  - name: media
    description: >
      Cloudflare R2 media service (05-communication-engine; reused by 08/11/12): presigned PUT
      (15-min TTL), server-side magic-byte confirm, short-lived download URLs, 90-day archival.
      The api never proxies object bytes.
paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [health]
      summary: Liveness — never touches dependencies
      responses:
        '200':
          description: Process is alive
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        default:
          $ref: '#/components/responses/Problem'
  /readyz:
    get:
      operationId: getReadyz
      tags: [health]
      summary: Readiness — Postgres (Neon) ping and Redis PING, 1 s timeout each
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: All dependencies reachable
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: One or more dependencies unreachable; `dependencies` names them
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/register:
    post:
      operationId: postAuthRegister
      tags: [auth]
      summary: Complete registration — user + identity + verification request in one transaction
      description: |
        Public, rate-limit class `auth` (10/hour/IP). Requires a previously verified OTP
        (purpose `register`). Hierarchy placement is re-validated server-side against 04 reads.
        Tokens are returned only when the phone OTP completed inside the same flow.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '201':
          description: Account created `PENDING` with an open verification request
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResult'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/otp/request:
    post:
      operationId: postAuthOtpRequest
      tags: [auth]
      summary: Issue a 6-digit OTP by SMS or email (passwordless login, owner decision 2026-10-02)
      description: |
        Public; class `auth`. Answers 202 identically whether or not the phone/email is
        registered (no enumeration). Caps: 60 s resend cooldown, 5/hour per target,
        200/hour/IP (CGNAT-tolerant), enforced again on resend.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequestInput'
      responses:
        '202':
          description: OTP queued for delivery
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpSendResult'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/otp/resend:
    post:
      operationId: postAuthOtpResend
      tags: [auth]
      summary: Resend a fresh OTP for the same target and purpose
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequestInput'
      responses:
        '202':
          description: OTP queued (identical body to request)
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpSendResult'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/otp/verify:
    post:
      operationId: postAuthOtpVerify
      tags: [auth]
      summary: Verify an OTP — login (tokens), or mark verified for register/link
      description: |
        Public; class `auth` (10 verifies/hour per target, 3 attempts per code). Purpose
        `login` returns tokens (an unknown target answers `{status:"unknown_phone"}` or
        `{status:"unknown_email"}` and the client continues to registration); purposes
        `register`/`link` return `{status:"verified"}` so the follow-up call can prove
        possession. Login is passwordless (owner decision 2026-10-02): both phone and email
        targets authenticate.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyInput'
      responses:
        '200':
          description: Verification outcome
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerifyResult'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/password/forgot:
    post:
      operationId: postAuthPasswordForgot
      tags: [auth]
      summary: Request a password-reset code by email
      description: Public; class `auth` (5/hour/email, 100/hour/IP). Always 202.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordInput'
      responses:
        '202':
          description: Accepted — a code is sent when the email belongs to a staff/vendor account
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/password/reset:
    post:
      operationId: postAuthPasswordReset
      tags: [auth]
      summary: Reset a staff/vendor password with the emailed code
      description: |
        Public; class `auth`. On success every session and refresh family of the user is
        revoked. Also serves as the vendor first-password set after 07 approval.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordInput'
      responses:
        '204':
          description: Password updated; all sessions revoked
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/refresh:
    post:
      operationId: postAuthRefresh
      tags: [auth]
      summary: Rotate a mobile refresh token (single-use, reuse-detecting)
      description: |
        Public (token in body); class `auth`. The presented token is revoked (`rotated`) and a
        new one is issued in the same family; claims are re-read from the database. Presenting
        a revoked token revokes the whole family and is audited (`auth.refresh_reuse`).
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshInput'
      responses:
        '200':
          description: Fresh token pair
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResult'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/logout:
    post:
      operationId: postAuthLogout
      tags: [auth]
      summary: Log out the current device (session or refresh family)
      security:
        - bearerJWT: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutInput'
      responses:
        '204':
          description: Current session/refresh family revoked
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/logout-all:
    post:
      operationId: postAuthLogoutAll
      tags: [auth]
      summary: Log out everywhere — every session and refresh family
      security:
        - bearerJWT: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '204':
          description: All sessions and refresh families revoked (audited)
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/google/start:
    get:
      operationId: getAuthGoogleStart
      tags: [auth]
      summary: Begin the Google OIDC round-trip (signed state + PKCE)
      description: |
        Public; class `auth` (20/hour/IP per provider). `intent=link` requires an
        authenticated user. Redirects to Google; the callback redirects to the calling
        surface (`/auth/sso/return` on web, deep link on the app) with a one-time result code.
      parameters:
        - name: intent
          in: query
          required: false
          schema:
            type: string
            enum: [login, link]
      responses:
        '302':
          description: Redirect to the provider
          headers:
            Location:
              description: Provider authorization endpoint
              schema:
                type: string
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/google/callback:
    get:
      operationId: getAuthGoogleCallback
      tags: [auth]
      summary: Google OIDC callback — link or create, then redirect with a result code
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the calling surface with `sso_result` (or `sso_error`)
          headers:
            Location:
              description: Calling surface URL carrying the one-time result or error
              schema:
                type: string
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/github/start:
    get:
      operationId: getAuthGithubStart
      tags: [auth]
      summary: Begin the GitHub OIDC round-trip (signed state + PKCE)
      parameters:
        - name: intent
          in: query
          required: false
          schema:
            type: string
            enum: [login, link]
      responses:
        '302':
          description: Redirect to the provider
          headers:
            Location:
              description: Provider authorization endpoint
              schema:
                type: string
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/github/callback:
    get:
      operationId: getAuthGithubCallback
      tags: [auth]
      summary: GitHub OIDC callback — link or create, then redirect with a result code
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the calling surface with `sso_result` (or `sso_error`)
          headers:
            Location:
              description: Calling surface URL carrying the one-time result or error
              schema:
                type: string
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/me:
    get:
      operationId: getMe
      tags: [users]
      summary: The authenticated user's own account
      description: Authenticate (either scheme); class `auth` relaxed (60/min/user).
      security:
        - bearerJWT: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Current user
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResult'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: patchMe
      tags: [users]
      summary: Update own display name and/or locale
      description: Role and status are immutable here (FORBIDDEN on attempt).
      security:
        - bearerJWT: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeUpdateInput'
      responses:
        '200':
          description: Updated user
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResult'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/verification-requests:
    get:
      operationId: listVerificationRequests
      tags: [verification]
      summary: The school's join-request queue
      description: |
        school_admin sees own school (all roles); student+`is_ambassador` sees same-school
        student/guardian requests only; super_admin sees everything. Tenant-scoped server-side.
      security:
        - bearerJWT: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/VerificationRequestStatus'
        - name: role
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/UserRole'
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Queue page
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationRequestPage'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/verification-requests/{id}/approve:
    post:
      operationId: approveVerificationRequest
      tags: [verification]
      summary: Approve a join request → user VERIFIED + provisioning enqueued
      description: |
        Guardian requests carry `{studentUserId}` — the same-school VERIFIED student the
        evidence matched; a `guardian_links` row is written in the same transaction.
        Already-decided requests answer CONFLICT. Audited `verification.approved`.
      security:
        - bearerJWT: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveInput'
      responses:
        '200':
          description: Approved
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResult'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/verification-requests/{id}/reject:
    post:
      operationId: rejectVerificationRequest
      tags: [verification]
      summary: Reject a join request with a mandatory reason
      description: school_admin/super_admin only (ambassadors are approve-only). Audited `verification.rejected`.
      security:
        - bearerJWT: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectInput'
      responses:
        '200':
          description: Rejected (reason stored; user notified via 06)
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResult'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/school/users:
    get:
      operationId: listSchoolUsers
      tags: [verification]
      summary: The school's user roster
      description: school_admin (own school from claim); super_admin may pass `?schoolId=`.
      security:
        - bearerJWT: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: schoolId
          in: query
          required: false
          schema:
            type: string
          description: Super Admin only — selects the school (tenant check still applies)
        - name: role
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/UserRole'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/UserStatus'
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 80
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Roster page (names, roles, statuses, masked phones only)
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolUserPage'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/hierarchy/cities:
    get:
      operationId: listHierarchyCities
      tags: [hierarchy]
      summary: Launch cities for the registration picker
      description: Public; master data owned by 04 (served from 03's in-memory fake until 04 lands).
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: City list (launch cities first)
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HierarchyCityPage'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/hierarchy/cities/{cityId}/schools:
    get:
      operationId: listHierarchySchools
      tags: [hierarchy]
      summary: Schools/colleges in a city
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: cityId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: School list
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HierarchySchoolPage'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/hierarchy/schools/{schoolId}/sections:
    get:
      operationId: listHierarchySections
      tags: [hierarchy]
      summary: Sections of a school (class level is a section attribute)
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: schoolId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Section list
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HierarchySectionPage'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/school-requests:
    post:
      operationId: createSchoolRequest
      tags: [school-requests]
      summary: Request onboarding for a school/college not yet listed
      description: |
        Public; class `auth`. Submitted from registration when the school dropdown has no
        match. Carries the institution details plus the point of contact — the application
        admin connects with the POC to onboard the institution. Audited `school.requested`.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchoolRequestInput'
      responses:
        '202':
          description: Request queued for admin review
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolRequestCreated'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/admin/school-requests:
    get:
      operationId: listSchoolRequests
      tags: [school-requests]
      summary: Review queue for institution requests (Super Admin)
      security:
        - bearerJWT: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/SchoolRequestStatus'
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Request queue page
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolRequestPage'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/admin/school-requests/{id}/approve:
    post:
      operationId: approveSchoolRequest
      tags: [school-requests]
      summary: Approve an institution request — POC is contacted for onboarding
      description: Super Admin only. Audited `school.request_approved`; the institution itself is created by 04's onboarding.
      security:
        - bearerJWT: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Approved
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolRequestDecision'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/admin/school-requests/{id}/reject:
    post:
      operationId: rejectSchoolRequest
      tags: [school-requests]
      summary: Reject an institution request with a reason
      security:
        - bearerJWT: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchoolRequestRejectInput'
      responses:
        '200':
          description: Rejected
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolRequestDecision'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/ws:
    get:
      operationId: getWs
      tags: [chat]
      summary: WebSocket gateway (gorilla upgrade — documented contract, not a REST route)
      description: |
        JWT in the `Authorization` header at upgrade; unauthenticated → HTTP 401, unverified →
        close 4401 (`NOT_VERIFIED`). The server resolves the subscribable room set from
        hierarchy + memberships — client `subscribe` requests are intersected with that set and
        non-member rooms are ignored + logged. Heartbeat ping ≤ 30 s (2 missed → close);
        presence keys TTL 60 s.
        x-ws-events (client→server): subscribe {rooms[]} · unsubscribe {rooms[]} ·
        message.send {clientMsgId, groupId, kind, body?, mediaAssetId?, replyTo?} ·
        message.read {groupId, lastReadMessageId} · typing {groupId, state start|stop} · ping.
        x-ws-events (server→client): message.new (full ChatMessage) · message.ack
        {clientMsgId, id, createdAt} · message.read {groupId, userId, lastReadMessageId} ·
        message.deleted {groupId, id, deletedAt} · presence.update {groupId, userId, online} ·
        typing {groupId, userId, state} · notice.new (Notice summary) · error (RFC-7807-shaped
        {type, title, status}). Reconnect: backoff 1 s → 30 s cap with jitter → re-auth →
        re-subscribe → REST catch-up from the latest local cursor → offline queue replay
        (dedupe by clientMsgId).
      responses:
        '101':
          description: Upgrade accepted (socket handed to the gateway hub)
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/chat/groups:
    get:
      operationId: listChatGroups
      tags: [chat]
      summary: My groups (official/custom/dm) with unread counts
      security:
