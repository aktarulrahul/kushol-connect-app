        name:
          type: string
        type:
          $ref: '#/components/schemas/SchoolRequestType'
        cityId:
          type: string
        address:
          type: string
        status:
          $ref: '#/components/schemas/SchoolRequestStatus'
        pocName:
          type: string
        pocPhone:
          type: string
          description: masked for display, e.g. `+8801XXXXXX789`
        pocEmail:
          type: string
        decisionReason:
          type: string
        createdAt:
