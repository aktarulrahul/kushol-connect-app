      operationId: createMediaUploadUrl
      tags: [media]
      summary: Presigned R2 PUT for one asset (TTL 15 min)
      description: Kind/size validated against the caps (image 10 MB, PDF 20 MB, voice 5 min);
        the sniff at confirm is authoritative over the declared mime.
      security:
        - bearerJWT: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaUploadUrlInput'
      responses:
        '201':
          description: Asset created (`pending`) with the presigned PUT
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaPresignResult'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/media/{assetId}/confirm:
    post:
      operationId: confirmMediaUpload
      tags: [media]
      summary: Confirm an upload — magic-byte sniff decides (INV-6)
      description: Owner only; TTL ≤ 15 min; sniffed mime must match the kind allowlist
        (JPEG/PNG/HEIC → image, %PDF → pdf, AAC/m4a → voice). A mismatch is
        `VALIDATION_FAILED` and no message may reference the asset.
      security:
        - bearerJWT: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaConfirmInput'
      responses:
        '200':
          description: Asset confirmed with the sniffed mime
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/media/{assetId}/download-url:
    post:
      operationId: createMediaDownloadUrl
      tags: [media]
      summary: Short-lived R2 GET URL for an asset the caller may view
      description: Authorized by ownership or by membership of a group/notice referencing the
        asset; archived assets rehydrate first (the response flags it).
      security:
        - bearerJWT: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Presigned GET (15-min TTL)
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaDownloadUrl'
        default:
          $ref: '#/components/responses/Problem'
components:
  headers:
    XRequestId:
      description: Request correlation id (incoming value reused when valid, otherwise a uuid v7)
      schema:
        type: string
        maxLength: 64
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: '`bn` (default) or `en` — selects the language of `Problem.message`'
      schema:
        type: string
  responses:
    Problem:
      description: Error (RFC-7807)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    DependencyCheck:
      type: object
      required: [name, ok]
      properties:
        name:
          type: string
          description: Dependency name, e.g. `postgres`, `redis`
        ok:
          type: boolean
        latencyMs:
          type: integer
          minimum: 0
    Readiness:
      type: object
      required: [status, dependencies]
      properties:
        status:
          type: string
          enum: [ready]
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/DependencyCheck'
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: JSON pointer or parameter name of the rejected input
        message:
          type: string
          description: Localized (bn default / en)
    ProblemErrors:
      type: object
      properties:
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    Problem:
      type: object
      description: RFC-7807 problem details with Kushol extensions.
      required: [type, title, status, code, message, requestId]
      properties:
        type:
          type: string
          description: URI reference identifying the problem type
        title:
          type: string
          description: Short English summary (not for display)
        status:
          type: integer
          minimum: 100
          maximum: 599
        code:
          type: string
          description: |
            Stable machine code — open set. Core: UNAUTHENTICATED, FORBIDDEN, VALIDATION_FAILED,
            TENANT_MISMATCH, NOT_FOUND, NOT_VERIFIED, RATE_LIMITED, QUOTA_EXCEEDED, CONFLICT,
            INTERNAL. Module-specific codes are registered in
            docs/modules/01-foundations/technical-document.md §10.
        message:
          type: string
          description: Localized, user-displayable message (bn default, en on request)
        requestId:
          type: string
        detail:
          type: string
        errors:
          $ref: '#/components/schemas/ProblemErrors'
        dependencies:
          type: array
          description: Present on readiness failures — names each dependency and its state
          items:
            $ref: '#/components/schemas/DependencyCheck'
    UserRole:
      type: string
      enum: [super_admin, school_admin, teacher, student, guardian, vendor]
      description: '`vendor` is platform-scoped (`schoolId` null) and never self-registered'
    UserStatus:
      type: string
      enum: [PENDING, VERIFIED, SUSPENDED]
    Locale:
      type: string
      enum: [bn, en]
    Plan:
      type: string
      enum: [free, pro]
    OtpChannel:
      type: string
      enum: [sms, email]
    OtpPurpose:
      type: string
      enum: [login, register, link]
      description: '`reset` OTPs are issued internally by `/auth/password/forgot` only'
    User:
      type: object
      description: Public user shape — phone numbers are always masked
      required: [id, role, status, locale, fullName, isAmbassador, plan]
      properties:
        id:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        locale:
          $ref: '#/components/schemas/Locale'
        fullName:
          type: string
        maskedPhone:
          type: string
          description: e.g. `+8801XXXXXX789` — present when the account has a phone
        email:
          type: string
          description: present when the account has an email
        schoolId:
          type: string
          nullable: true
        isAmbassador:
          type: boolean
        plan:
          $ref: '#/components/schemas/Plan'
    RegisterInput:
      type: object
      required: [locale, role, fullName, schoolId, sectionId]
      description: |
        `phone`+`otpCode` are required for student/guardian (OTP purpose `register` proven).
        Staff may register with `email`+`password` instead (phone optional). `studentCode`
        and `relation` are required when role is `guardian`. No class field — the class
        level is derived from the section.
      properties:
        locale:
          $ref: '#/components/schemas/Locale'
        role:
          $ref: '#/components/schemas/UserRole'
        fullName:
          type: string
          minLength: 2
          maxLength: 80
        phone:
          type: string
          description: BD mobile, normalized server-side to E.164 `+880…`
        otpCode:
          type: string
          description: The code verified via `/auth/otp/verify` (purpose `register`)
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 10
          maxLength: 128
          description: Staff registration only (argon2id server-side)
        schoolId:
          type: string
        sectionId:
          type: string
        studentCode:
          type: string
          minLength: 3
          maxLength: 20
          description: Guardian only — the child's student ID
        relation:
          type: string
          enum: [father, mother, other]
          description: Guardian only
    RegisterResult:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [user, verificationRequest]
          properties:
            user:
              $ref: '#/components/schemas/User'
            accessToken:
              type: string
              description: Present only when the phone OTP completed in this flow
            refreshToken:
              type: string
            verificationRequest:
              $ref: '#/components/schemas/VerificationRequestItem'
