              type: integer
              minimum: 0
            channel:
              $ref: '#/components/schemas/OtpChannel'
    OtpVerifyInput:
      type: object
      required: [otpCode, purpose]
      description: Exactly one of `phone` / `email` (matching the request channel).
      properties:
        phone:
          type: string
        email:
          type: string
          format: email
        otpCode:
          type: string
          minLength: 6
          maxLength: 6
        purpose:
          $ref: '#/components/schemas/OtpPurpose'
    OtpVerifyResult:
      type: object
      required: [data]
      properties:
        data:
          type: object
          description: |
            `login` on a known phone/email returns tokens + user; an unknown target answers
            `{status:"unknown_phone"}` or `{status:"unknown_email"}` (deliberate — OTP proves
            possession and registration shares the code path). `register`/`link` return
            `{status:"verified"}`.
          required: [status]
          properties:
            status:
              type: string
              enum: [ok, unknown_phone, unknown_email, verified]
            accessToken:
              type: string
            refreshToken:
              type: string
            user:
              $ref: '#/components/schemas/User'
